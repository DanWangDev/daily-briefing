{% if status == "pending" %}
<div class="gen-progress"
     hx-get="/api/briefings/status"
     hx-trigger="every 2s"
     hx-target="#briefing-content"
     hx-swap="innerHTML">
    <div class="gen-progress-spinner"></div>
    <div class="gen-progress-text">
        <strong>{{ _("gen.generating") }}</strong>
        <p>{{ _("gen.generating_text") }}</p>
    </div>
</div>
{% elif status == "failed" %}
<div class="gen-progress gen-progress--failed">
    <div class="gen-progress-icon">!</div>
    <div class="gen-progress-text">
        <strong>{{ _("gen.failed") }}</strong>
        <p>{{ _("gen.failed_text") }}</p>
    </div>
</div>
{% else %}
<div class="gen-progress">
    <div class="gen-progress-spinner"></div>
    <div class="gen-progress-text">
        <strong>{{ _("gen.working") }}</strong>
    </div>
</div>
{% endif %}
