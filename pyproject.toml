[project]
name = "daily-briefing"
version = "0.1.0"
description = "Automated daily financial briefing with news neutralization"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "yfinance>=0.2",
    "httpx>=0.28",
    "apscheduler>=3.10,<4",
    "anthropic>=0.42",
    "openai>=1.60",
    "python-multipart>=0.0.18",
    "aiosmtplib>=3.0",
    "cryptography>=44.0",
    "ChatTTS>=0.2",
    "torch>=2.1",
    "torchaudio>=2.1",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
briefing = [
    "web/static/**/*",
    "web/templates/**/*",
    "web/i18n/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
